name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Dump OpenAPI
        run: python scripts/dump_openapi.py
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ matrix.os }}-py${{ matrix.python-version }}
          path: docs/api/openapi.json

  coverage-gate:
    name: coverage-gate-py3.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install test extras
        run: python -m pip install pytest-cov pdfplumber
      - name: Coverage Gate
        run: pytest --cov=invstruct --cov-report=xml --cov-fail-under=80 -q

  build-dist:
    name: build-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build verification
        run: python -m build
      - name: Build
        run: python -m build
      - name: Dump OpenAPI
        run: python scripts/dump_openapi.py
      - name: Package Release Bundle
        run: python scripts/package_release.py
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            release/*
            docs/api/openapi.json

  security-scan:
    name: security-scan-bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and bandit
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install bandit
      - name: Run bandit high severity gate
        run: bandit -r src/invstruct -ll
