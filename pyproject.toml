[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invstruct"
version = "0.1.0"
description = "Invoice and receipt structuring toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.0",
  "rich>=13.0.0",
  "python-multipart>=0.0.9",
  "pandas>=2.1.0",
  "openpyxl>=3.1.0",
  "build>=1.2.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "build>=1.2.0",
]
pdf = [
  "pdfplumber>=0.11.0",
  "pypdfium2>=4.0.0",
  "Pillow>=10.0.0",
]
paddle = [
  "paddleocr>=2.7.0",
]

[project.scripts]
invstruct = "invstruct.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
