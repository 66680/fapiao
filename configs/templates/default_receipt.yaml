template_id: default_receipt
version: 1.0.0
locale: zh-CN
doc_type: receipt
aliases:
  total_amount_gross: ["合计", "总计", "价税合计", "total amount"]
  issue_date: ["开票日期", "日期", "date"]
  merchant_tax_id: ["税号", "纳税人识别号"]
  invoice_number: ["发票号", "invoice no", "no."]
regex:
  issue_date: "(20\\d{2}(?:[-/]\\d{1,2}[-/]\\d{1,2}|年\\d{1,2}月\\d{1,2}日))"
  total_amount_gross: "([¥￥]?\\s?\\d+[\\.,]?\\d{0,2})"
  merchant_tax_id: "([0-9A-Z]{15,20})"
  invoice_number: "(?:发票号|invoice\\s*no\\.?|no\\.?)\\s*[:：]?\\s*(\\d{6,})"
anchors:
  total_amount_gross:
    keywords: ["价税合计", "合计"]
    roi: [0.0, 0.0, 1.0, 1.0]
    direction: right_or_below
scoring:
  ocr_conf_weight: 0.4
  regex_weight: 0.3
  layout_weight: 0.3
validators:
  - type: required
    field: merchant_name
    severity: critical
  - type: gt
    field: total_amount_gross
    value: 0
    severity: critical

